<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Homelab architecture: clients connect over Tailscale to a Proxmox server and a Raspberry Pi">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #e2e8f0; }
      .title { font-size: 22px; font-weight: 600; }
      .group { font-size: 14px; font-weight: 600; fill: #94a3b8; }
      .node { font-size: 14px; text-anchor: middle; }
      .small { font-size: 12px; text-anchor: middle; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="960" height="560" rx="14" fill="#0f172a"/>
  <text x="30" y="45" class="title">Homelab architecture</text>

  <!-- Clients -->
  <rect x="30" y="80" width="200" height="420" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="46" y="106" class="group">CLIENTS</text>
  <rect x="50" y="130" width="160" height="50" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="130" y="160" class="node">Phone</text>
  <rect x="50" y="200" width="160" height="50" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="130" y="230" class="node">Laptop</text>
  <rect x="50" y="270" width="160" height="50" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="130" y="300" class="node">PC</text>
  <rect x="50" y="340" width="160" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-dasharray="5 4"/>
  <text x="130" y="367" class="node">Friends' phones</text>
  <text x="130" y="386" class="small">shared HA instance only</text>

  <!-- Tailscale -->
  <rect x="300" y="80" width="80" height="420" rx="10" fill="#0c4a6e" stroke="#38bdf8"/>
  <text transform="translate(348,290) rotate(-90)" class="node" style="font-weight:600">Tailscale mesh VPN (WireGuard)</text>

  <!-- Client arrows -->
  <line x1="230" y1="155" x2="298" y2="155" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="230" y1="225" x2="298" y2="225" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="230" y1="295" x2="298" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="230" y1="370" x2="298" y2="370" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- Proxmox -->
  <rect x="450" y="80" width="480" height="260" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="466" y="106" class="group">HP PROLIANT G7 TOWER · PROXMOX VE</text>

  <rect x="470" y="125" width="100" height="50" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="520" y="155" class="node">Firefly III</text>
  <rect x="585" y="125" width="100" height="50" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="635" y="155" class="node">Vaultwarden</text>
  <rect x="700" y="125" width="100" height="50" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="750" y="155" class="node">Immich</text>
  <rect x="815" y="125" width="100" height="50" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="865" y="155" class="node">Nextcloud</text>

  <rect x="470" y="215" width="100" height="50" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="520" y="245" class="node">Homepage</text>
  <rect x="585" y="215" width="100" height="50" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="635" y="245" class="node">Prometheus</text>
  <rect x="740" y="215" width="100" height="50" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="790" y="245" class="node">Grafana</text>
  <line x1="685" y1="240" x2="738" y2="240" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="765" y="290" class="small">Monitoring: metrics → dashboards</text>

  <!-- Raspberry Pi -->
  <rect x="450" y="380" width="480" height="120" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="466" y="406" class="group">RASPBERRY PI 4B · RASPBERRY PI OS</text>
  <rect x="470" y="425" width="210" height="55" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="575" y="449" class="node">Home Assistant</text>
  <text x="575" y="467" class="small">+ Zigbee dongle</text>
  <rect x="700" y="425" width="215" height="55" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="807" y="449" class="node">Home Assistant</text>
  <text x="807" y="467" class="small">shared instance (location sharing)</text>

  <!-- Tailscale to servers -->
  <line x1="380" y1="200" x2="448" y2="200" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="440" x2="448" y2="440" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
